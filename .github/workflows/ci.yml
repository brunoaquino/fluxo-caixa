name: CI

on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, master]
    paths:
      - "services/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [lancamentos-service, consolidado-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Testes e verificacao
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          if-no-files-found: ignore
          path: |
            services/${{ matrix.service }}/target/surefire-reports/**
            services/${{ matrix.service }}/target/failsafe-reports/**
            services/${{ matrix.service }}/target/site/jacoco/**

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem ARM64
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          tags: fluxo-caixa/${{ matrix.service }}:${{ github.sha }}
          # O Trivy lê o layout OCI (diretório com index.json), não o tar OCI.
          outputs: type=oci,tar=false,dest=/tmp/${{ matrix.service }}

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/${{ matrix.service }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
