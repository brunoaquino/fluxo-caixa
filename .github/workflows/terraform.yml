name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main, master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt antes do validate: um arquivo fora do padrao nao chega a ser planejado.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - run: terraform fmt -recursive -check infra/terraform

  validate:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, hml, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Init e validate
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform init -backend=false && terraform validate

  validate-bootstrap:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Init e validate do bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate

  # Regras do provider AWS alem do que o validate enxerga (nomes, argumentos obsoletos).
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v6
      - name: Init do plugin AWS
        working-directory: infra/terraform
        run: tflint --init --config=.tflint.hcl
      - name: Lint
        working-directory: infra/terraform
        run: tflint --recursive --config="${PWD}/.tflint.hcl"

  # Testes nativos com mock. Nao sobem recurso na AWS.
  test:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [messaging, network, alb, ecs-service, rds-postgres, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: terraform test
        working-directory: infra/terraform/modules/${{ matrix.module }}
        run: terraform test

  # Politica de seguranca. Soft-fail enquanto o baseline nao esta zerado:
  # o trivy config abaixo e o gate que falha o job.
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          download_external_modules: false
          soft_fail: true

  # Misconfiguracao HIGH/CRITICAL. Excecoes ficam no codigo com trivy:ignore e o motivo.
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Infracost precisa de um plan de verdade por causa dos data sources da AWS.
  # Sem a chave e sem a flag de plan, o job registra o motivo e sai com sucesso.
  infracost:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          KEY: ${{ secrets.INFRACOST_API_KEY }}
          FLAG: ${{ vars.AWS_TERRAFORM_PLAN_ENABLED }}
          ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -n "$KEY" ] && [ "$FLAG" = "true" ] && [ -n "$ROLE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Infracost ignorado. Exige INFRACOST_API_KEY, AWS_TERRAFORM_PLAN_ENABLED=true e AWS_PLAN_ROLE_ARN."
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.run == 'true'
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v4
        if: steps.gate.outputs.run == 'true'
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: infracost/actions/setup@v3
        if: steps.gate.outputs.run == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Breakdown de dev
        if: steps.gate.outputs.run == 'true'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          TF_CLI_ARGS_init: -backend=false
        run: |
          infracost breakdown \
            --path infra/terraform/envs/dev \
            --terraform-var-file infra/terraform/envs/dev/terraform.tfvars.example \
            --format json \
            --out-file /tmp/infracost.json
          infracost comment github \
            --path /tmp/infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --behavior update

  # Plan real so na main ou por disparo manual, e so se a variavel de repositorio
  # estiver ligada. O PR nao espera aprovacao de Environment.
  plan:
    if: vars.AWS_TERRAFORM_PLAN_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env: [dev, hml, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Sem role, sem plan
        if: vars.AWS_PLAN_ROLE_ARN == '' || vars.TF_STATE_BUCKET == ''
        run: echo "AWS_PLAN_ROLE_ARN ou TF_STATE_BUCKET ausente no environment ${{ matrix.env }}. Plan ignorado."
      - uses: hashicorp/setup-terraform@v4
        if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Plan
        if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        working-directory: infra/terraform/envs/${{ matrix.env }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi
          cat > backend.hcl << EOF
          bucket       = "${TF_STATE_BUCKET}"
          key          = "fluxo-caixa/${{ matrix.env }}/terraform.tfstate"
          region       = "us-east-1"
          encrypt      = true
          kms_key_id   = "${TF_STATE_KMS_KEY_ID}"
          use_lockfile = true
          EOF
          terraform init -backend-config=backend.hcl
          terraform plan -input=false -var-file=terraform.tfvars -out="${{ matrix.env }}.tfplan"
