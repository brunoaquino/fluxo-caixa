# Hooks de IaC. tfsec foi absorvido pelo Trivy; o hook terraform_trivy cobre o mesmo papel.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/infra/terraform/.tflint.hcl
      - id: terraform_docs
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--soft-fail
      - id: terraform_trivy
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
