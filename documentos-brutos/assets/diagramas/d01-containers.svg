<title id="t">Fluxo de Caixa — containers</title>
<desc id="d">Comerciante acessa CloudFront, API Gateway e ALB interno até lancamentos-service e consolidado-service; lançamentos grava no Postgres e publica no SNS; SQS entrega ao consolidado, que grava a projeção e usa cache; os dois serviços validam o JWT no Cognito ou Keycloak.</desc>
