<text x="1190.0" y="781.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Aplica crédito</text>
<text x="1190.0" y="797.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ou débito</text>
<text x="804.0" y="765.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Atualiza saldo</text>
