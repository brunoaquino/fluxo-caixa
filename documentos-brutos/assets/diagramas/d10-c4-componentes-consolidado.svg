<title id="t">C4 — Nível 3: componentes do consolidado-service</title>
<desc id="d">Componentes internos do consolidado-service: controller de consulta, segurança, casos de uso de consulta e de aplicação de lançamento, domínio SaldoDiario, consumidor SQS, tradutor ACL, repositório JDBC e cache Redis, com Postgres, Redis/Valkey, fila SQS e Cognito/Keycloak fora do container.</desc>
