<text x="195.0" y="131.0" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">Cognito ou Keycloak</text>
<text x="195.0" y="151.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[OIDC]</text>
<text x="195.0" y="170.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">JWKS</text>
<text x="997.0" y="141.0" font-size="16" font-weight="600" fill="#7F1D1D" text-anchor="middle">Redis ou Valkey</text>
<text x="997.0" y="161.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[cache]</text>
<text x="997.0" y="180.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Descartável</text>
<text x="1388.0" y="131.0" font-size="16" font-weight="600" fill="#4C1D95" text-anchor="middle">SQS</text>
<text x="1388.0" y="151.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[consolidado-lancamentos-queue]</text>
<text x="1388.0" y="170.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Buffer</text>
<text x="195.0" y="336.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ConfiguracaoSeguranca</text>
<text x="195.0" y="356.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[config]</text>
<text x="195.0" y="375.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Escopo consolidado:read e</text>
<text x="195.0" y="392.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">claim comerciante_id</text>
<text x="591.0" y="336.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ConsultaConsolidadoController</text>
<text x="591.0" y="356.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.in.web]</text>
<text x="591.0" y="375.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">GET do dia e do período.</text>
<text x="591.0" y="392.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Relatório inicio/fim/dias</text>
<text x="1388.0" y="336.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ConsumidorSqsLancamentos</text>
<text x="1388.0" y="356.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.in.messaging]</text>
<text x="1388.0" y="375.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Long polling em</text>
<text x="1388.0" y="392.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">CONSOLIDADO_QUEUE_URL</text>
<text x="591.0" y="554.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ConsultarSaldoDiarioService e</text>
<text x="591.0" y="574.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ConsultarRelatorioService</text>
<text x="591.0" y="594.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[application.servico]</text>
<text x="591.0" y="613.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Cache-aside e saldo acumulado</text>
<text x="997.0" y="554.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">CacheSaldoRedis</text>
<text x="997.0" y="574.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.out.cache]</text>
<text x="997.0" y="593.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Versão por comerciante.</text>
<text x="997.0" y="610.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">TTL 30s. REDIS_SSL</text>
<text x="1388.0" y="554.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">TradutorEventoLancamento</text>
<text x="1388.0" y="574.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.in.messaging]</text>
<text x="1388.0" y="593.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">JSON v1 vira comando.</text>
<text x="1388.0" y="610.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Versão desconhecida falha</text>
<text x="591.0" y="782.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">RepositorioConsolidadoJdbc</text>
<text x="591.0" y="802.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.out.persistence]</text>
<text x="591.0" y="821.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">saldos_diarios e</text>
<text x="591.0" y="838.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">eventos_processados</text>
<text x="997.0" y="782.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">AplicarLancamentoService</text>
<text x="997.0" y="802.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[application.servico]</text>
<text x="997.0" y="821.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">UPSERT atômico e</text>
<text x="997.0" y="838.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">idempotência por eventId</text>
<text x="1388.0" y="782.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">SaldoDiario</text>
<text x="1388.0" y="802.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[domain.model]</text>
<text x="1388.0" y="821.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Invariante saldo =</text>
<text x="1388.0" y="838.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">créditos − débitos</text>
<text x="591.0" y="1001.0" font-size="16" font-weight="600" fill="#1E3A8A" text-anchor="middle">Postgres consolidado</text>
<text x="591.0" y="1021.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[PostgreSQL 17]</text>
<text x="591.0" y="1040.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Projeção</text>
<text x="378.0" y="335.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Autoriza</text>
<text x="378.0" y="351.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a leitura</text>
<text x="600.0" y="473.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /api/v1/consolidados</text>
<text x="804.0" y="537.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Busca pela</text>
<text x="804.0" y="553.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">geração</text>
<text x="804.0" y="569.0" font-size="13" font-weight="400" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">corrente</text>
<text x="582.0" y="689.0" font-size="13" font-weight="400" fill="#334155" text-anchor="end" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Miss: lê saldo e</text>
<text x="582.0" y="705.0" font-size="13" font-weight="400" fill="#334155" text-anchor="end" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SUM acumulado</text>
<text x="1379.0" y="473.0" font-size="13" font-weight="400" fill="#334155" text-anchor="end" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Entrega o corpo raw</text>
