<text x="211.0" y="131.0" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">Cognito ou Keycloak</text>
<text x="211.0" y="151.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[OIDC]</text>
<text x="211.0" y="170.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">JWKS</text>
<text x="211.0" y="336.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">SegurancaConfig</text>
<text x="211.0" y="356.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[config]</text>
<text x="211.0" y="375.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Valida issuer, assinatura</text>
<text x="211.0" y="392.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">e escopo SCOPE_</text>
<text x="591.0" y="336.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">LancamentoController</text>
<text x="591.0" y="356.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.in.web]</text>
<text x="591.0" y="375.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">DTOs e RFC 9457. Extrai</text>
<text x="591.0" y="392.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">comerciante_id do JWT</text>
<text x="211.0" y="564.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">RegistrarLancamentoServico</text>
<text x="211.0" y="584.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[application.servico]</text>
<text x="211.0" y="603.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Idempotência por</text>
<text x="211.0" y="620.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">impressao_digital</text>
<text x="591.0" y="564.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">Lancamento e Dinheiro</text>
<text x="591.0" y="584.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[domain.lancamento e domain.dinheiro]</text>
<text x="591.0" y="603.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Java puro. Sem Spring</text>
<text x="971.0" y="564.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">EstornarLancamentoServico</text>
<text x="971.0" y="584.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[application.servico]</text>
<text x="971.0" y="603.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Estorno único.</text>
<text x="971.0" y="620.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Idempotency-Key no POST</text>
<text x="1378.0" y="564.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ConsultarLancamentoServico e</text>
<text x="1378.0" y="584.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">ListarLancamentosServico</text>
<text x="1378.0" y="604.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[application.servico]</text>
<text x="1378.0" y="623.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Detalhe e página</text>
<text x="1378.0" y="640.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">conteudo/pagina/tamanho/</text>
<text x="1378.0" y="657.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">totalElementos/totalPaginas</text>
<text x="591.0" y="834.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">Repositorios JPA</text>
<text x="591.0" y="854.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.out.persistence]</text>
<text x="591.0" y="873.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">lancamentos, idempotencia,</text>
<text x="591.0" y="890.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">outbox_eventos</text>
<text x="971.0" y="834.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">RelayOutbox</text>
<text x="971.0" y="854.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.out.messaging]</text>
<text x="971.0" y="873.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">SKIP LOCKED e</text>
<text x="971.0" y="890.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">proxima_tentativa_em</text>
<text x="1378.0" y="834.0" font-size="16" font-weight="600" fill="#0F3D3A" text-anchor="middle">SnsPublicador</text>
<text x="1378.0" y="854.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[adapters.out.messaging]</text>
<text x="1378.0" y="873.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Publica em</text>
<text x="1378.0" y="890.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">LANCAMENTOS_TOPIC_ARN</text>
<text x="591.0" y="1051.0" font-size="16" font-weight="600" fill="#1E3A8A" text-anchor="middle">Postgres lancamentos</text>
<text x="591.0" y="1071.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">[PostgreSQL 17]</text>
<text x="591.0" y="1090.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Banco do serviço</text>
<text x="1378.0" y="1041.0" font-size="16" font-weight="600" fill="#4C1D95" text-anchor="middle">SNS</text>
