<title id="t">C4 — Nível 3: componentes do lancamentos-service</title>
<desc id="d">Componentes internos do lancamentos-service: LancamentoController, SegurancaConfig, casos de uso de registro, estorno e consulta, domínio Lancamento e Dinheiro, repositórios JPA, RelayOutbox e SnsPublicador, com Postgres, Cognito/Keycloak e o tópico SNS fora do container.</desc>
