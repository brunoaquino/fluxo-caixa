<title id="t">Sequência interna do registrar lançamento</title>
<desc id="d">LancamentoController envia o comando ao RegistrarLancamentoService, que cria Dinheiro e, conforme a chave de idempotência, devolve 200 com o recurso armazenado, 409 para corpo diferente ou, na primeira vez, registra o Lancamento, insere no LancamentoRepository, na Outbox e grava a chave no mesmo commit, devolvendo 201.</desc>
