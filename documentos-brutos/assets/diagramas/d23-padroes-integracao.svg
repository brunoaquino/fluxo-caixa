<title id="t">Padrões de integração — os dois canais</title>
<desc id="d">Canal síncrono: Comerciante, REST com OAuth2, CloudFront, API Gateway REST, ALB interno, lancamentos-service, que grava no Postgres na mesma transação. Canal assíncrono: relay Publish-Subscribe para SNS, SQS e consolidado-service, com Dead Letter Channel para a DLQ.</desc>
