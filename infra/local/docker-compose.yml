name: fluxo-caixa

# Perfil infra: so dependencias, para rodar os servicos pela IDE ou pelo mvnw.
# Perfil completo: dependencias e os dois servicos.
# O Compose nao sobe servico com profile no "up" sem flag. O alvo padrao e o Makefile:
#   make infra-up
#   make up

services:
  postgres:
    profiles: ["infra", "completo"]
    image: postgres:17-alpine
    container_name: fluxo-caixa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    profiles: ["infra", "completo"]
    image: redis:7.4-alpine
    container_name: fluxo-caixa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  localstack:
    profiles: ["infra", "completo"]
    image: localstack/localstack:4.7
    container_name: fluxo-caixa-localstack
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: sa-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  keycloak:
    profiles: ["infra", "completo"]
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: fluxo-caixa-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/fluxo-caixa-realm.json:/opt/keycloak/data/import/fluxo-caixa-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  otel-lgtm:
    profiles: ["infra", "completo"]
    image: grafana/otel-lgtm:0.40.0
    container_name: fluxo-caixa-otel
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  lancamentos-service:
    profiles: ["completo"]
    build:
      context: ../../services/lancamentos-service
      dockerfile: Dockerfile
    container_name: fluxo-caixa-lancamentos
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/lancamentos
      DB_USERNAME: lancamentos
      DB_PASSWORD: lancamentos
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      LANCAMENTOS_TOPIC_ARN: arn:aws:sns:sa-east-1:000000000000:fluxo-caixa-lancamentos-events
      JWT_ISSUER_URI: http://localhost:8080/realms/fluxo-caixa
      JWT_JWK_SET_URI: http://keycloak:8080/realms/fluxo-caixa/protocol/openid-connect/certs
      APP_SECURITY_SCOPE_PREFIX: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness || curl -fsS http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  consolidado-service:
    profiles: ["completo"]
    build:
      context: ../../services/consolidado-service
      dockerfile: Dockerfile
    container_name: fluxo-caixa-consolidado
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/consolidado
      DB_USERNAME: consolidado
      DB_PASSWORD: consolidado
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      CONSOLIDADO_QUEUE_URL: http://localstack:4566/000000000000/consolidado-lancamentos-queue
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      JWT_ISSUER_URI: http://localhost:8080/realms/fluxo-caixa
      JWT_JWK_SET_URI: http://keycloak:8080/realms/fluxo-caixa/protocol/openid-connect/certs
      APP_SECURITY_SCOPE_PREFIX: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness || curl -fsS http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
