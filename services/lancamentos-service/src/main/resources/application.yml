server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  forward-headers-strategy: none

spring:
  application:
    name: lancamentos-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: lancamentos
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    map-environment-variables: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}

app:
  security:
    comerciante-claim: ${APP_SECURITY_COMERCIANTE_CLAIM:comerciante_id}
    scope-prefix: ${APP_SECURITY_SCOPE_PREFIX:}
  messaging:
    topic-arn: ${LANCAMENTOS_TOPIC_ARN}
  outbox:
    intervalo-ms: 500
    lote: 100
    backoff-maximo-segundos: 60

info:
  app:
    nome: lancamentos-service
    descricao: Registro de créditos, débitos e estornos do fluxo de caixa
